apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-risk-api
  labels: {app: heart-risk-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: heart-risk-api}}
  template:
    metadata: {labels: {app: heart-risk-api}}
    spec:
      containers:
        - name: api
          image: heart-risk-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15}
