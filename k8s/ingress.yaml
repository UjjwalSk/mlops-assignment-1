apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-risk-api-ingress
  namespace: heart-risk
  labels:
    app: heart-risk-api
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-risk-api
                port:
                  number: 80
